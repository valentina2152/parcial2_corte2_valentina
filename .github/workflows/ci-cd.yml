name: CI/CD BikeParq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analisis-estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B checkstyle:check

  pruebas-unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Dtest='*Test,!RunCucumberTest'

  pruebas-bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Dtest=RunCucumberTest

  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  despliegue:
    runs-on: ubuntu-latest
    needs: [analisis-estatico, pruebas-unitarias, pruebas-bdd, cobertura]
    steps:
      - run: echo "Desplegado"
